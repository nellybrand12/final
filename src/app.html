<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Hotel Résidence Madadjeu | L'élégance au cœur du luxe</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
		<script>
			(function() {
				try {
					var urlLang = new URLSearchParams(window.location.search).get('lang');
					var savedLang = localStorage.getItem('madadjeu_lang');
					var activeLang = (urlLang === 'en' || urlLang === 'fr') ? urlLang : ((savedLang === 'en' || savedLang === 'fr') ? savedLang : 'fr');
					document.documentElement.lang = activeLang;

					var isAdmin = window.location.pathname.startsWith('/admin');
					var key = isAdmin ? 'admin-theme' : 'theme';
					var saved = localStorage.getItem(key);
					var isDark = false;
					if (saved === 'dark') {
						isDark = true;
					} else if (saved === 'light') {
						isDark = false;
					} else {
						isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					}
					if (isDark) {
						document.documentElement.classList.add('dark');
						document.documentElement.style.colorScheme = 'dark';
					} else {
						document.documentElement.classList.remove('dark');
						document.documentElement.style.colorScheme = 'light';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface font-body-md text-on-surface antialiased selection:bg-muted-gold/30 selection:text-deep-charcoal">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
